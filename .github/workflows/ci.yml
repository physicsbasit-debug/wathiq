name: فحص واثق

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: البناء والاختبارات
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: فحص نظافة المستودع
        run: node scripts/check-repository-hygiene.mjs

      - name: تثبيت الاعتماديات
        run: npm install --no-audit --no-fund

      - name: تشغيل الفحص الكامل
        run: npm run check

      - name: حفظ النسخة المبنية
        uses: actions/upload-artifact@v4
        with:
          name: wathiq-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
