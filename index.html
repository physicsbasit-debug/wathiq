<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <style>
      /* --- متطلبات حارس الجودة لدعم اتجاه RTL --- */
      html, body, #app { direction: rtl; text-align: right; }
      input, select, textarea { direction: rtl; }
      .mobile-nav { display: grid; grid-template-columns: repeat(3, 1fr); }
      
      body {
        background-color: #e9ecef;
        font-family: 'Arial', sans-serif;
        padding: 40px 20px;
        margin: 0;
      }
      #control-panel {
        max-width: 210mm;
        margin: 0 auto 20px auto;
        text-align: center;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      }
      .btn-primary {
        background-color: #1d3f72;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
      }
      #exam-container {
        background-color: #ffffff;
        max-width: 210mm;
        min-height: 297mm;
        margin: 0 auto;
        padding: 40px 50px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        border: 1px solid #ccc;
        border-radius: 4px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <!-- لوحة التحكم الوهمية حالياً لطلب الاختبار -->
    <div id="control-panel">
      <h2 style="color: #1d3f72;">واثق - منصة التقييم المؤسسية</h2>
      <button class="btn-primary" onclick="alert('سيتم ربط هذا الزر بمحرك الذكاء الاصطناعي (Supabase) في الخطوات القادمة!')">توليد اختبار جديد (AI)</button>
    </div>

    <!-- حاوية الاختبار الأساسية -->
    <div id="exam-container"></div>
    
    <!-- هذه الملفات سيتم بناؤها تلقائياً بواسطة Github Actions بعد نجاح الفحص -->
    <script src="./runtime-config.js"></script>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
